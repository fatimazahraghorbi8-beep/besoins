<style>
/* Layout: phone-first single column. Header with category name, one scrolling area (budget card, items table with running total), persistent bottom category bar. Five user-picked themes, so the page keeps its own look instead of following the system theme. */
:root {
  --bg: #F3E9DF;
  --surface: #FBF6F0;
  --fg: #3A2A2A;
  --muted: #6F5B57;
  --line: #E4D3C6;
  --accent: #B35871;
  --accent-fg: #FFFFFF;
  --accent-soft: #F1D9DD;
  --accent-ink: #8E3F57;
  --warn: #B3261E;
  --warn-soft: #F6DAD6;
  --font: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
}
:root[data-app="green"] {
  --bg: #EFEAD9; --surface: #F8F5EA; --fg: #2C3326; --muted: #646A55; --line: #DDD8C1;
  --accent: #4F7050; --accent-fg: #FFFFFF; --accent-soft: #DCE5D0; --accent-ink: #3C5A3D;
}
:root[data-app="brown"] {
  --bg: #EEE3D3; --surface: #F8F1E6; --fg: #33261C; --muted: #6E5B49; --line: #DFD0BA;
  --accent: #7F5035; --accent-fg: #FFFFFF; --accent-soft: #E9D6C2; --accent-ink: #66402A;
}
:root[data-app="gold"] {
  --bg: #F2EAD6; --surface: #FBF6E8; --fg: #36301F; --muted: #6F6347; --line: #E3D6B3;
  --accent: #9A7015; --accent-fg: #FFFFFF; --accent-soft: #F1E3B8; --accent-ink: #7A5A0F;
}
:root[data-app="black"] {
  --bg: #121212; --surface: #1C1C1E; --fg: #F2EDE6; --muted: #A39C92; --line: #2E2C2A;
  --accent: #E0B9A5; --accent-fg: #1A1A1A; --accent-soft: #2B2420; --accent-ink: #E0B9A5;
  --warn: #FF9A90; --warn-soft: #3A1F1D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { display: block; flex: none; }

.app { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.band {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 8px; }
.title-btn { display: flex; align-items: center; gap: 10px; min-width: 0; text-align: start; border-radius: 12px; }
.title-btn .txt { min-width: 0; }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.title-btn h1 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title-btn .ic { color: var(--muted); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  color: var(--fg); background: var(--surface); border: 1px solid var(--line); flex: none;
}

/* Scroll area */
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-block: 8px 24px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }

/* Budget */
.budget label { display: block; font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.money { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--line); }
.money:focus-within { border-bottom-color: var(--accent); }
.money input {
  flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
  font-size: 32px; font-weight: 700; padding: 4px 0; text-align: start; font-variant-numeric: tabular-nums;
}
.money input::placeholder { color: var(--muted); opacity: 0.5; }
.cur { font-size: 16px; font-weight: 600; color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 4px 12px;
  border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: 14px; font-weight: 600;
}
.chip.over { background: var(--warn-soft); color: var(--warn); }

/* List */
.list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.list-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
.empty { margin: 4px 0 12px; padding: 18px 12px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; color: var(--muted); font-size: 15px; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 92px 40px; gap: 8px; align-items: center; }
.in {
  width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: 16px; outline: none;
}
.in:focus { border-color: var(--accent); }
.in::placeholder { color: var(--muted); opacity: 0.6; }
.in.price { text-align: end; font-variant-numeric: tabular-nums; }
.del { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.del:hover { background: var(--accent-soft); color: var(--accent-ink); }
.add {
  width: 100%; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; border-radius: 12px; border: 1px dashed var(--accent); color: var(--accent-ink); font-weight: 600;
}
.add:hover { background: var(--accent-soft); }

/* Footer: total and comparison */
.foot { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
.foot.over { background: var(--warn-soft); }
.tot { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.tot .lbl { font-weight: 600; color: var(--muted); }
.tot .amt { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tot .amt small { font-size: 15px; font-weight: 600; color: var(--muted); }
.track { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 0.2s; }
.foot.over .fill { background: var(--warn); }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.kv span:first-child { color: var(--muted); }
.kv.strong { font-weight: 700; }
.kv.strong span:first-child { color: inherit; }
.foot.over .kv.strong { color: var(--warn); }
.note { margin: 0; font-size: 14px; color: var(--muted); }
.foot.over .note { color: var(--warn); font-weight: 600; }

/* Bottom bar */
.tabs { display: flex; align-items: stretch; gap: 8px; padding-block: 8px; background: var(--surface); border-top: 1px solid var(--line); }
.tabs-scroll { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.tab {
  flex: none; min-width: 68px; max-width: 110px; padding: 8px 10px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 12px; font-weight: 600;
}
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
.tab.plus { min-width: 52px; border: 1px dashed var(--accent); color: var(--accent-ink); justify-content: center; }

/* Sheets */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet {
  width: 100%; max-width: 560px; max-height: 90%; overflow-y: auto; background: var(--surface);
  border-radius: 20px 20px 0 0; padding-top: 18px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sh-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sh-head h2 { margin: 0; font-size: 20px; }
.grp { margin-bottom: 18px; }
.grp-t { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.swatches button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; text-align: center; overflow-wrap: anywhere; color: var(--muted); }
.sw { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); }
.swatches button[aria-pressed="true"] .sw { outline: 2px solid var(--accent); outline-offset: 3px; }
.swatches button[aria-pressed="true"] { color: var(--fg); font-weight: 700; }
.field label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.in.big { font-size: 18px; padding: 12px 14px; }
.in[aria-invalid="true"] { border-color: var(--warn); }
.actions { display: flex; gap: 8px; margin-top: 16px; }
.btn { flex: 1; min-height: 48px; border-radius: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.danger { color: var(--warn); }
.btn.danger.armed { background: var(--warn); border-color: var(--warn); color: var(--surface); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top band">
    <button class="title-btn" id="catTitle" type="button">
      <span class="txt">
        <span class="eyebrow" id="eyebrow"></span>
        <h1 id="catName"></h1>
      </span>
    </button>
    <button class="icon-btn" id="settingsBtn" type="button"></button>
  </header>
  <main class="scroll band"><div class="wrap" id="view"></div></main>
  <nav class="tabs band">
    <div class="tabs-scroll" id="tabs" role="tablist"></div>
    <button class="tab plus" id="addCat" type="button"></button>
  </nav>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

  var LANGS = [["fr", "Français"], ["en", "English"], ["ar", "العربية"]];

    clothes: '<path d="M8 3 3 6l2 4 3-1v11h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0z"/>',
    custom: '<path d="M3 12V4h8l10 10-8 8z"/><path d="M7.5 8h.01"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
    trash: '<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
    sliders: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',

  function svg(n, s) {
    s = s || 22;
    return '<svg class="ic" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + "</svg>";
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function uid() { return Math.random().toString(36).slice(2, 9); }

  /* Parses what the person typed: Arabic-Indic digits, comma or dot decimals, stray spaces. */
  function toNum(s) {
    if (s === null || s === undefined) return 0;
    s = String(s).replace(/[٠-٩]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); }).replace(/[٫,]/g, ".").replace(/[^0-9.]/g, "");

    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }
  var NF = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
  function fmt(n) { return NF.format(Math.round(n * 100) / 100); }

  function defaults() {
    return {
      lang: "ar", theme: "rose", active: "c1",
      cats: [
        { id: "c1", key: "home", name: null, budget: "", items: [] },
        { id: "c2", key: "school", name: null, budget: "", items: [] },
        { id: "c3", key: "face", name: null, budget: "", items: [] },
        { id: "c4", key: "clothes", name: null, budget: "", items: [] }
      ]
    };
  }
  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.cats) && d.cats.length) {
          if (!T[d.lang]) d.lang = "ar";
          if (!THEMES.some(function (x) { return x.id === d.theme; })) d.theme = "rose";
          if (!d.cats.some(function (c) { return c.id === d.active; })) d.active = d.cats[0].id;
          d.cats.forEach(function (c) { if (!Array.isArray(c.items)) c.items = []; if (c.budget == null) c.budget = ""; });

        '<div class="list-head"><h2>' + esc(t("list")) + "</h2></div>" +
        rows +
        '<button class="add" type="button" data-act="add">' + svg("plus", 20) + "<span>" + esc(t("add")) + "</span></button>" +
        '<div class="foot" id="foot">' +
          '<div class="tot"><span class="lbl">' + esc(t("total")) + '</span><span class="amt"><bdi id="total">0</bdi> <small>' + esc(t("cur")) + "</small></span></div>" +
          '<div class="track" id="track"><div class="fill" id="bar"></div></div>' +
          '<div class="kv" id="budRow"><span>' + esc(t("budgetShort")) + '</span><span id="bud"></span></div>' +
          '<div class="kv strong" id="remRow"><span id="remLbl"></span><span id="rem"></span></div>' +
          '<p class="note" id="note" hidden></p>' +
        "</div>" +
      "</section>";
    updateSummary();
  }

  function updateSummary() {
    var c = cur();
    if (!c || !$("foot")) return;
    var total = Math.round(c.items.reduce(function (s, i) { return s + toNum(i.price); }, 0) * 100) / 100;
    $("total").textContent = fmt(total);
    var hasB = String(c.budget).trim() !== "";
    var foot = $("foot"), chip = $("chip"), note = $("note");
    if (!hasB) {
      chip.hidden = true; $("budRow").hidden = true; $("remRow").hidden = true; $("track").hidden = true;
      foot.classList.remove("over");
      note.hidden = false; note.textContent = t("noBudget");
      return;
    }
    var b = toNum(c.budget);
    var rem = Math.round((b - total) * 100) / 100;
    var over = rem < 0;
    var label = over ? t("over") : t("remaining");
    var amt = fmt(Math.abs(rem)) + " " + t("cur");
    foot.classList.toggle("over", over);
    chip.classList.toggle("over", over);
    $("budRow").hidden = false; $("remRow").hidden = false; $("track").hidden = false;
    $("bud").textContent = fmt(b) + " " + t("cur");
    $("remLbl").textContent = label;
    $("rem").textContent = amt;
    $("bar").style.width = (b > 0 ? Math.min(100, (total / b) * 100) : (total > 0 ? 100 : 0)) + "%";
    chip.hidden = false;
    chip.innerHTML = (over ? svg("warn", 16) : "") + "<span>" + esc(label + ": " + amt) + "</span>";
    note.hidden = !over;
    note.textContent = over ? t("overNote") : "";
  }

  function render() {
    applyPrefs();
    renderHeader();
    renderTabs();
    renderView();
  }

  /* Items */
  function addRow() {
    var c = cur();
    var it = { id: uid(), name: "", price: "" };
    c.items.push(it);
    save();
    renderView();
    var el = $("n-" + it.id);
    if (el) { el.focus(); try { el.scrollIntoView({ block: "center" }); } catch (e) {} }
  }

  var view = $("view");
  view.addEventListener("input", function (e) {
    var el = e.target, c = cur();
    if (el.id === "budget") { c.budget = el.value; save(); updateSummary(); return; }
    var row = el.closest(".row");
    if (!row) return;
    var it = c.items.find(function (i) { return i.id === row.getAttribute("data-id"); });
    if (!it) return;
    if (el.getAttribute("data-f") === "name") it.name = el.value;
    else if (el.getAttribute("data-f") === "price") it.price = el.value;
    save();
    updateSummary();
  });
  view.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    if (b.getAttribute("data-act") === "add") { addRow(); return; }
    if (b.getAttribute("data-act") === "del") {
      var id = b.closest(".row").getAttribute("data-id");
      var c = cur();
      c.items = c.items.filter(function (i) { return i.id !== id; });
      save();
      renderView();
    }
  });
  view.addEventListener("keydown", function (e) {
    var f = e.target.getAttribute && e.target.getAttribute("data-f");
    if (e.key !== "Enter" || !f) return;
    e.preventDefault();
    var row = e.target.closest(".row");
    if (f === "name") { row.querySelector('[data-f="price"]').focus(); return; }
    var rows = Array.prototype.slice.call(view.querySelectorAll(".row"));
    var i = rows.indexOf(row);
    if (i < rows.length - 1) rows[i + 1].querySelector('[data-f="name"]').focus();
    else addRow();
  });

  /* Bottom bar */
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]");
    if (!b) return;
    S.active = b.getAttribute("data-cat");
    save();
    render();
  });
  $("addCat").addEventListener("click", function () { openCatSheet(null); });
  $("catTitle").addEventListener("click", function () { openCatSheet(S.active); });
  $("settingsBtn").addEventListener("click", openSettings);

  /* Sheets */
  var overlay = $("overlay"), sheet = $("sheet");
  function closeSheet() { overlay.hidden = true; sheet.innerHTML = ""; }
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay || e.target.closest("[data-close]")) closeSheet();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !overlay.hidden) closeSheet(); });

  function head(title) {
    return '<div class="sh-head"><h2>' + esc(title) + '</h2><button class="icon-btn" type="button" data-close aria-label="' + esc(t("close")) + '">' + svg("close") + "</button></div>";
  }

  function openSettings() {
    sheet.innerHTML = head(t("settings")) +
      '<div class="grp"><div class="grp-t">' + esc(t("language")) + '</div><div class="seg">' +
      LANGS.map(function (l) { return '<button type="button" data-lang="' + l[0] + '" aria-pressed="' + (S.lang === l[0]) + '">' + l[1] + "</button>"; }).join("") +
      "</div></div>" +
      '<div class="grp"><div class="grp-t">' + esc(t("colors")) + '</div><div class="swatches">' +
      THEMES.map(function (th) {
        return '<button type="button" data-theme-pick="' + th.id + '" aria-pressed="' + (S.theme === th.id) + '">' +
          '<span class="sw" style="background:linear-gradient(135deg,' + th.bg + " 50%," + th.ac + ' 50%)"></span><span>' + esc(t("th_" + th.id)) + "</span></button>";
      }).join("") + "</div></div>";
    overlay.hidden = false;
  }
  sheet.addEventListener("click", function (e) {
    var l = e.target.closest("[data-lang]");
    if (l) { S.lang = l.getAttribute("data-lang"); save(); render(); openSettings(); return; }
    var p = e.target.closest("[data-theme-pick]");
    if (p) { S.theme = p.getAttribute("data-theme-pick"); save(); render(); openSettings(); }
  });

  function openCatSheet(id) {
    var c = id ? S.cats.find(function (x) { return x.id === id; }) : null;
    var isNew = !c;
    var canDel = !isNew && S.cats.length > 1;
    sheet.innerHTML = head(isNew ? t("addCat") : t("editCat")) +
      '<div class="field"><label for="catInput">' + esc(t("catName")) + '</label>' +
      '<input class="in big" id="catInput" dir="auto" maxlength="30" autocomplete="off" value="' + esc(c ? catLabel(c) : "") + '"></div>' +
      '<div class="actions"><button class="btn primary" type="button" id="catSave">' + esc(t("save")) + "</button>" +
      (canDel ? '<button class="btn danger" type="button" id="catDel">' + esc(t("del")) + "</button>" : "") + "</div>";
    overlay.hidden = false;
    var inp = $("catInput");
    setTimeout(function () { inp.focus(); if (c) inp.select(); }, 50);

    function doSave() {
      var name = inp.value.trim();
      if (!name) { inp.setAttribute("aria-invalid", "true"); inp.focus(); return; }
      if (isNew) {
        var nc = { id: uid(), key: null, name: name, budget: "", items: [] };
        S.cats.push(nc);
        S.active = nc.id;
      } else {
        S.active = c.id;
        c.name = c.key && name === T[S.lang]["cat_" + c.key] ? null : name;
      }
      save(); closeSheet(); render();
    }
    $("catSave").addEventListener("click", doSave);
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doSave(); } });
    inp.addEventListener("input", function () { inp.removeAttribute("aria-invalid"); });
    var d = $("catDel");
    if (d) d.addEventListener("click", function () {
      if (!d.classList.contains("armed")) { d.classList.add("armed"); d.textContent = t("confirmDel"); return; }
      var i = S.cats.indexOf(c);
      S.cats.splice(i, 1);
      S.active = S.cats[Math.max(0, i - 1)].id;
      save(); closeSheet(); render();
    });
  }

  render();
})();
</script>

</body></html>
